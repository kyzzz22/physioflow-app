name: Refactor quality

on:
  push:
    branches: [demo]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run quality:refactor
      - uses: browser-actions/setup-chrome@v1
      - run: npm run test:e2e:refactor-browser
